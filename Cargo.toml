[package]
name = "desktui"
version = "0.1.2"
edition = "2024"
# Not the 1.85 that edition 2024 alone would need: the terminal probe uses
# let-chains, stable since 1.88, and fast_image_resize asks for 1.87. Verified by
# building on 1.87 (fails) and 1.88 (succeeds).
rust-version = "1.88"
license = "MIT"
description = "A remote desktop client for your terminal"
repository = "https://github.com/mishushakov/desktui"
keywords = ["ghostty", "kitty", "remote-desktop", "tui", "vnc-client"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
fast_image_resize = "6.1"
flate2 = "1.1"
futures = "0.3"
libc = "0.2"
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zune-jpeg = "0.5"

# The perf test drives the same pipeline stages the renderer uses.
[dev-dependencies]
base64 = "0.23"
flate2 = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
