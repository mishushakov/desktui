name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer irrelevant, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than `stable`, because clippy gains lints with every release and
  # `-D warnings` turns each new one into a red build on a commit that changed
  # nothing. Bump this deliberately and fix the fallout in that commit.
  RUST_VERSION: "1.97.1"

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a result worth having, not a reason to cancel
      # the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      # The pty and vnc suites drive a pty and a fake server, so they need
      # neither a real terminal nor Docker. The live and perf suites are
      # #[ignore]d and stay out of CI: one needs the desktop container, and the
      # other is a timing measurement that a shared runner cannot make honestly.
      - run: cargo test --locked
